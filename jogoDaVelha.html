<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Um jogo de tic-tac-toe, também conhecido como jogo da velha.">
        <title>Jogo da Velha</title>
        <link rel="stylesheet" href="./css/style.css">
        <script src="js/jogoDaVelha.js" defer></script>
    </head>
    <body onLoad="Iniciar()">
        <main class="game-shell">
            <header class="game-header">
                <p class="eyebrow">Jogo de tabuleiro</p>
                <h1>Jogo da Velha</h1>
                <p class="subtitle">Três em linha. Uma jogada por vez.</p>
            </header>

            <section class="game-card" aria-label="Jogo da velha">
                <div class="status" id="aviso" aria-live="polite">Vez do jogador 1</div>

                <div id="board" class="board" aria-label="Tabuleiro do jogo"></div>

                <div class="controls">
                    <form class="move-form" onsubmit="Jogar(); return false;">
                        <div class="field-group">
                            <label for="linha">Linha</label>
                            <input type="number" id="linha" min="1" max="3" value="1" required>
                        </div>

                        <div class="field-group">
                            <label for="coluna">Coluna</label>
                            <input type="number" id="coluna" min="1" max="3" value="1" required>
                        </div>

                        <button id="jogar" class="button button-primary" type="submit">Marcar</button>
                    </form>

                    <p id="alerta" class="alerta" role="alert"></p>
                    <button id="restart" class="button button-secondary" type="button" onclick="Resetar()" disabled>Resetar</button>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>Desenvolvido por <a href="https://github.com/marpolos/" target="_blank" rel="noopener noreferrer">Marcelle Monteiro</a></p>
            <p>Imersão da disciplina Práticas de Programação da Gran Faculdade</a></p>
        </footer>
    </body>
</html>
